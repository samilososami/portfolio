<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools — Samilososami</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 520px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #cbd5e1;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #6366f1;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);
    }
    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .info h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f1f5f9;
    }
    .info p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: #6366f1;
      background: rgba(99, 102, 241, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tools</h1>
    <a href="/tools/ai-web-designer" class="card">
      <div class="logo">AWB</div>
      <div class="info">
        <h2>AI Web Designer</h2>
        <p>Genera paginas web con IA usando Ollama Cloud. Landing pages, portfolios, dashboards y mas.</p>
      </div>
      <span class="badge">Nuevo</span>
    </a>
  </div>
</body>
</html>
